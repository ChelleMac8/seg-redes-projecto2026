{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h1>Enviar mensagem</h1>

<label>Destinatário</label>
<select name="to" required>
  <option value="" disabled selected>Escolha o destinatário...</option>
  {% for r in recipients %}
    <option value="{{ r['username'] }}">{{ r['username'] }}</option>
  {% endfor %}
</select>
    <label>Mensagem</label>
    <textarea rows="5" placeholder="Escreva a sua mensagem..." required></textarea>

    <label>Imagem (opcional)</label>
    <input type="file" accept="image/*">

    <div class="actions">
      <button class="btn" type="submit">Enviar</button>
      <a class="btn ghost" href="{{ url_for('index') }}">Voltar</a>
    </div>
  </form>

  <p class="hint">
     hash + assinatura + cifragem estilo PGP antes de “enviar”.
  </p>
</section>
{% endblock %}
