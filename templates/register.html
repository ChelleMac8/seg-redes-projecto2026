{% extends "layout.html" %}

{% block title %}Criar conta{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block main_class %}login-main{% endblock %}

{% block content %}
<section class="container-login">
  <h1>Criar conta</h1>
  <p>Regista um utilizador novo.</p>

  <form class="form" method="post">
    <div class="input-box">
      <input name="username" type="text" placeholder="utilizador" minlength="3" required>
      <i class="bx bxs-user"></i>
    </div>

    <div class="input-box">
      <input name="email" type="email" placeholder="email" required>
      <i class="bx bxs-envelope"></i>
    </div>

    <div class="input-box">
      <input name="password" type="password" placeholder="senha" minlength="6" required>
      <i class="bx bxs-lock-alt"></i>
    </div>

    <div class="input-box">
      <input name="confirm" type="password" placeholder="confirmar senha" required>
      <i class="bx bxs-lock-alt"></i>
    </div>

    <div class="actions">
      <button class="btn" type="submit">Criar conta</button>
    </div>

    <div class="register-link">
      <p>Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
    </div>
  </form>
</section>
{% endblock %}
