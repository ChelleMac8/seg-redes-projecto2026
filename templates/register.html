{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h1>🧾 Criar conta</h1>
  <p>Regista um utilizador novo.</p>

  <form class="form" method="post">
    <label>Username</label>
    <input name="username" placeholder="ex: michelle" minlength="3" required>

    <label>Senha</label>
    <input type="password" name="password" placeholder="mínimo 6" minlength="6" required>

    <label>Confirmar senha</label>
    <input type="password" name="confirm" required>

    <div class="actions">
      <button class="btn" type="submit">Criar conta</button>
      <a class="btn secondary" href="{{ url_for('login') }}">Já tenho conta</a>
    </div>
  </form>
</section>
{% endblock %}
