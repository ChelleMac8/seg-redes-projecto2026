<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title if title else "Secure Chat" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🔐 Secure Chat</div>
    <nav class="nav">
      <a href="{{ url_for('index') }}">Menu</a>
      <a href="{{ url_for('send') }}">Enviar</a>
      <a href="{{ url_for('inbox') }}">Inbox</a>
      <a href="{{ url_for('logout') }}">Sair</a>
    </nav>
  </header>

  <main class="container">

    {% with msgs = get_flashed_messages() %}
      {% if msgs %}
        <div class="card" style="margin-bottom:12px; background: rgba(0,0,0,.20);">
          {% for m in msgs %}
            <div style="padding:6px 0; opacity:.9;">{{ m }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    @2026_Matsinhe_Fumo_Macamo
  </footer>
</body>
</html>
